# Strategy + risk configuration for the JJ NY-session strategy bot.

strategy:
  timezone: "America/New_York"
  session_open: "09:30"          # anchor candle
  continuation_end_minutes: 10   # phase 1: 0-10 min after open
  reversion_end_minutes: 90      # phase 2: 10-90 min after open
  hard_cutoff: "11:00"           # no new entries after this time regardless of phase
  min_extension_points: 12       # min move away from open before a reversion trade is valid
  displacement_size_ratio: 1.15  # candle range must be >= this * avg(range, lookback)
  displacement_prev_ratio: 1.0   # candle range must be >= this * previous candle range
  max_wick_ratio: 0.30           # (total wick) / range must be <= this to count as displacement
  structure_lookback: 30         # minutes to look back for swing high/low ("structure")
  swing_strength: 2              # bars on each side required to confirm a pivot
  break_buffer_points: 1.0       # close must clear structure by this much to avoid noise breaks
  htf_bar_minutes: 5             # bars aggregated into a synthetic higher-timeframe candle for bias confluence

risk:
  # Reverted from the AI-Optimize "Row #1" geometry (45pt/35pt on 3 contracts):
  # that config's $2,700 max single-trade loss exceeded the real Topstep
  # trailing drawdown limit ($2,000 below), meaning a single loss would
  # guaranteed-bust the eval. This 25pt/38pt/2-contract sizing is deliberately
  # designed around the real account numbers: $1,000 loss x 2 losing days =
  # exactly the $2,000 drawdown limit; $1,520 gain x 2 winning days = $3,040,
  # clearing the $3,000 profit target with margin. Per user instruction.
  #
  # NOTE on Topstep's Consistency Target: best single day must stay <=50% of
  # the $3,000 profit target ($1,500) or "the Profit Target increases" —
  # confirmed this does NOT fail the account, it's a soft constraint, not a
  # bust condition. $1,520 slightly exceeds $1,500 (per user's own
  # confirmation from a Topstep trader — small overage accounts for fees).
  # The exact escalation formula (how much the target increases) is NOT
  # currently known or modeled — confirm with Topstep before assuming 2
  # winning days still cleanly passes under a raised target.
  stop_points: 25
  target_points: 38              # ~1:1.5 R:R as in the video
  max_trades_per_day: 1          # one trade per account per day, per user instruction
  stop_after_consecutive_losses: 2
  contracts_per_trade: 2         # 25pts=-$1000, 38pts=+$1520 at $20/point — never 1 contract
  # Daily rate limiter: stop trading for the day once running P&L touches
  # either cap. Sized to the real Topstep account rules above.
  daily_profit_cap: 1520
  daily_loss_cap: 1000
  # Global override applied on top of whichever saved strategy is active
  # (Strat 2, TestV5, etc.) — once the account's REAL live balance is
  # within one normal-size trade of clearing the eval's profit_target
  # below, shrink that trade's stop/target down to exactly what's needed
  # to pass, keeping the same reward:risk ratio. Only ever shrinks, never
  # grows a trade bigger than the static size. Per user instruction.
  eval_scale_down_enabled: true
  eval_scale_min_target_dollars: 200

instrument:
  symbol: "NQ"                   # Nasdaq-100 e-mini futures, front month resolved at runtime
  tick_size: 0.25
  tick_value: 5.0                # USD per tick, NQ

virtual_accounts:
  # "Practice mode" (scripts/run_virtual_practice.py): simulates N abstract
  # accounts against live TopstepX market data, with no real order ever
  # placed. Each distinct setup the strategy finds during the session is
  # handed to the next idle virtual account instead of being cloned across
  # all of them (unlike the real live runner's fan-out), so every account
  # takes its own trade. One trade per account per day, same as real
  # trading; if the session produces fewer setups than accounts, the rest
  # simply don't trade that day.
  count: 10

topstep_eval:                    # used by the backtester AND the live TopstepEvalSimulator
  account_size: 50000
  profit_target: 3000
  trailing_max_drawdown: 2000
  daily_loss_limit: null         # set if your eval enforces one
  # Per Topstep's Rebill Agreement: a bust doesn't force an immediate $85
  # charge — Topstep gives ONE FREE "Reset-at-Rebill" automatically at your
  # next 30-day rebill date if the account is still ineligible then. The
  # $85 reset fee only applies if you reset BEFORE that date to resume
  # trading sooner (which also shifts your billing cycle to the reset
  # date). This model deliberately assumes an immediate paid reset on every
  # bust (worst-case/upper-bound cost) since an actively-trading bot
  # resetting right away beats sitting idle for the rest of a 30-day cycle
  # — confirmed as the intended assumption, not an oversight.
  # PROMO PRICING — Topstep's current pricing page (50K, Daily Loss Limit
  # account) shows $85/mo (promo, may change) for this account type, $85
  # reset fee on a bust (mirrors the monthly price), Express Funded
  # Activation Fee is FREE. Topstep no longer offers a separate
  # cheaper-monthly/pricier-activation plan — both "plans" below are set
  # identically so the sim's plan-switch logic (harmless if unused) can't
  # diverge from real cost. These are all easy single-line edits here if
  # Topstep changes pricing — check their current page periodically.
  eval_fee: 85
  reactivation_fee: 85
  monthly_fee: 85
  activation_fee: 0
  no_activation_fee_monthly_fee: 85
  pass_rate_switch_threshold: 0.0
  payout_share: 0.9
  # PROMO VALUE — Topstep's page currently shows a promotional payout cap
  # of $4,000 (base $2,000). Update this single line if the promo changes.
  max_payout_per_event: 4000
  max_payout_balance_share: 0.5
  min_winning_days_for_payout: 5
  min_winning_day_profit: 150
  consistency_path_min_days: 3
  consistency_path_max_best_day_share: 0.4
